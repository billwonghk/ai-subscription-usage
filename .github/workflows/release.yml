name: Build desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/privacy_check.py
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: macos-apple-silicon
            mac_arch: arm64
            mac_asset: AI-Subscription-Usage-macOS-Apple-Silicon.zip
          - runner: macos-15-intel
            artifact: macos-intel
            mac_arch: x86_64
            mac_asset: AI-Subscription-Usage-macOS-Intel.zip
          - runner: windows-2022
            artifact: windows-x64
            mac_arch: ""
            mac_asset: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify macOS runner architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          actual="$(uname -m)"
          expected="${{ matrix.mac_arch }}"
          test "$actual" = "$expected" || { echo "Expected $expected runner, got $actual"; exit 1; }
      - run: python -m pip install -r requirements-desktop.txt
      - run: pyinstaller --clean --noconfirm ai-subscription-usage.spec
      - name: Verify macOS application architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary="dist/AI Subscription Usage.app/Contents/MacOS/AI Subscription Usage"
          actual="$(lipo -archs "$binary")"
          expected="${{ matrix.mac_arch }}"
          file "$binary"
          test "$actual" = "$expected" || { echo "Expected $expected application, got $actual"; exit 1; }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path src\desktop_app.py -Pattern 'APP_VERSION = "([^"]+)"').Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\windows.iss
      - name: Verify bundled application
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "dist/AI Subscription Usage.exe" --self-test
          else
            "dist/AI Subscription Usage.app/Contents/MacOS/AI Subscription Usage" --self-test
          fi
      - name: Check packaged privacy
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python scripts/privacy_check.py --package dist
          else
            python scripts/privacy_check.py --package "dist/AI Subscription Usage.app"
          fi
      - name: Windows diagnostics
        if: runner.os == 'Windows'
        timeout-minutes: 2
        shell: pwsh
        run: |
          foreach ($flag in @('--doctor', '--verify-sources')) {
            $proc = Start-Process -FilePath "dist/AI Subscription Usage.exe" -ArgumentList $flag -PassThru -RedirectStandardOutput "diagnostic-out.txt" -RedirectStandardError "diagnostic-err.txt"
            if (-not $proc.WaitForExit(30000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "$flag did not exit within 30 seconds"
            }
            if ($proc.ExitCode -ne 0) {
              Get-Content "diagnostic-err.txt" -ErrorAction SilentlyContinue | Write-Host
              throw "$flag failed with exit code $($proc.ExitCode)"
            }
            $result = Get-Content "diagnostic-out.txt" -Raw | ConvertFrom-Json
            if ($null -eq $result -or $result.schema_version -ne 1) { throw "$flag returned no valid diagnostic data" }
            Write-Host "$flag returned valid JSON"
          }
      - name: Windows tray lifecycle and UTF-8 UI smoke test
        if: runner.os == 'Windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $dataDir = "$env:LOCALAPPDATA\AI Subscription Usage"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          Set-Content -Path "$dataDir\settings.json" -Value '{"language":"zh-TW","onboarding_complete":true}' -Encoding utf8NoBOM
          $application = Start-Process -FilePath "dist/AI Subscription Usage.exe" -PassThru
          try {
            $response = $null
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Date) -lt $deadline -and $null -eq $response) {
              if ($application.HasExited) { throw "Tray application exited before its local UI became available" }
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:17653/settings" -TimeoutSec 2
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if ($null -eq $response -or $response.StatusCode -ne 200) { throw "Tray application's local UI did not become available" }
            if ($response.Headers['Content-Type'] -notmatch 'charset=utf-8') { throw "Settings page did not declare UTF-8" }
            if ($response.Content -notmatch 'AI 訂閱用量：設定' -or $response.Content -notmatch '繁體中文' -or $response.Content -notmatch '0.5.1') {
              throw "Settings page did not contain the expected Traditional Chinese UI and version"
            }

            $edge = @(
              "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $edge) { throw "Microsoft Edge was not found on the Windows runner" }
            $screenshot = Join-Path $PWD "windows-settings-smoke.png"
            $edgeProcess = Start-Process -FilePath $edge -ArgumentList @(
              '--headless=new', '--disable-gpu', '--hide-scrollbars', '--window-size=1440,1200',
              "--screenshot=$screenshot", 'http://127.0.0.1:17653/settings'
            ) -PassThru
            if (-not $edgeProcess.WaitForExit(30000)) {
              Stop-Process -Id $edgeProcess.Id -Force -ErrorAction SilentlyContinue
              throw "Edge did not finish the Windows UI screenshot within 30 seconds"
            }
            if (-not (Test-Path $screenshot) -or (Get-Item $screenshot).Length -lt 10000) { throw "Windows UI screenshot was not generated correctly" }

            $quit = Start-Process -FilePath "dist/AI Subscription Usage.exe" -ArgumentList '--quit-running' -PassThru
            if (-not $quit.WaitForExit(15000) -or $quit.ExitCode -ne 0) { throw "Packaged application quit command failed" }
            if (-not $application.WaitForExit(15000)) { throw "Tray application did not exit after its authenticated quit command" }
            Write-Host "Windows tray lifecycle and UTF-8 UI smoke test passed"
          } finally {
            if (-not $application.HasExited) { Stop-Process -Id $application.Id -Force -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: windows-ui-smoke
          path: windows-settings-smoke.png
      - name: Windows upgrade-retention test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dataDir = "$env:LOCALAPPDATA\AI Subscription Usage"

          Write-Host "---- Testing: does --refresh exit on its own? ----"
          $refreshProc = Start-Process -FilePath "dist/AI Subscription Usage.exe" -ArgumentList "--refresh" -PassThru -RedirectStandardOutput "refresh-out.txt" -RedirectStandardError "refresh-err.txt"
          $refreshFinished = $refreshProc.WaitForExit(30000)
          if (-not $refreshFinished) {
            Write-Host "##[error]--refresh did not exit within 30s (PID $($refreshProc.Id)); killing it"
            Stop-Process -Id $refreshProc.Id -Force -ErrorAction SilentlyContinue
            Get-Content "refresh-out.txt","refresh-err.txt" -ErrorAction SilentlyContinue | Write-Host
            throw "--refresh hung on Windows instead of exiting"
          }
          Write-Host "--refresh exit code: $($refreshProc.ExitCode)"
          Get-Content "refresh-out.txt","refresh-err.txt" -ErrorAction SilentlyContinue | Write-Host

          Write-Host "---- Preparing a marker file to test reinstall retention ----"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $marker = "$dataDir\upgrade-test-marker.json"
          Set-Content -Path $marker -Value '{"marker":"pre-upgrade"}' -NoNewline
          $before = Get-Content $marker -Raw

          Write-Host "---- Testing: does the silent installer exit on its own? ----"
          $installer = (Get-ChildItem "dist-installer\*.exe" | Select-Object -First 1).FullName
          Write-Host "Installer: $installer"
          $proc = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru
          $finished = $proc.WaitForExit(120000)
          if (-not $finished) {
            Write-Host "##[error]Installer did not exit within 120s (PID $($proc.Id)); killing it and any launched app"
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process -Name "AI Subscription Usage" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Still running: PID $($_.Id)" }
            Get-Process -Name "AI Subscription Usage" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            throw "Installer hung for more than 120 seconds"
          }
          Write-Host "Installer exit code: $($proc.ExitCode)"

          if (-not (Test-Path $marker)) { throw "user data directory was wiped by the installer" }
          $after = Get-Content $marker -Raw
          if ($before -ne $after) { throw "user data content changed after reinstall" }
          Write-Host "Upgrade retention test passed: existing user data survived a reinstall"
      - name: Package macOS release
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "dist/AI Subscription Usage.app" "release-assets/${{ matrix.mac_asset }}"
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path "dist\AI Subscription Usage.exe" -DestinationPath "release-assets\AI-Subscription-Usage-Windows-Portable.zip"
          Copy-Item "dist-installer\*.exe" release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: ai-subscription-usage-${{ matrix.artifact }}
          path: release-assets/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: ai-subscription-usage-*
          merge-multiple: true
      - run: sha256sum release/* > release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: docs/release-v0.5.1.md
          files: release/*
