name: Update model pricing

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/fetch_pricing.py
      - run: python scripts/privacy_check.py
      - run: python -m unittest discover -s tests -v
      - name: Commit and push if pricing changed
        run: |
          if git diff --quiet -- config/pricing.json config/pricing-manifest.json; then
            echo "No pricing changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/pricing.json config/pricing-manifest.json
          git commit -m "Weekly pricing refresh from OpenRouter"
          git push
