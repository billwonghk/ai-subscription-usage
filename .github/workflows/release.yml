name: Build desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/privacy_check.py
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    strategy:
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-desktop.txt
      - run: pyinstaller --clean --noconfirm ai-subscription-usage.spec
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path src\desktop_app.py -Pattern 'APP_VERSION = "([^"]+)"').Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\windows.iss
      - name: Verify bundled application
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "dist/AI Subscription Usage.exe" --self-test
          else
            "dist/AI Subscription Usage.app/Contents/MacOS/AI Subscription Usage" --self-test
          fi
      - name: Windows diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $doctor = & "dist/AI Subscription Usage.exe" --doctor 2>&1 | Out-String
          Write-Host "---- --doctor exit code: $LASTEXITCODE ----"
          Write-Host $doctor
          $doctor | ConvertFrom-Json | Out-Null
          $sources = & "dist/AI Subscription Usage.exe" --verify-sources 2>&1 | Out-String
          Write-Host "---- --verify-sources exit code: $LASTEXITCODE ----"
          Write-Host $sources
          $sources | ConvertFrom-Json | Out-Null
      - name: Windows upgrade-retention test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dataDir = "$env:LOCALAPPDATA\AI Subscription Usage"
          & "dist/AI Subscription Usage.exe" --refresh | Out-Null
          if (-not (Test-Path "$dataDir\settings.json")) { throw "settings.json was not created on first run" }
          $marker = "$dataDir\upgrade-test-marker.json"
          Set-Content -Path $marker -Value '{"marker":"pre-upgrade"}' -NoNewline
          $before = Get-Content $marker -Raw
          $installer = (Get-ChildItem "dist-installer\*.exe" | Select-Object -First 1).FullName
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (-not (Test-Path $marker)) { throw "user data directory was wiped by the installer" }
          $after = Get-Content $marker -Raw
          if ($before -ne $after) { throw "user data content changed after reinstall" }
          if (-not (Test-Path "$dataDir\settings.json")) { throw "settings.json missing after reinstall" }
          Write-Host "Upgrade retention test passed: existing user data survived a reinstall"
      - name: Package macOS release
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent "dist/AI Subscription Usage.app" "release-assets/AI-Subscription-Usage-macOS.zip"
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path "dist\AI Subscription Usage.exe" -DestinationPath "release-assets\AI-Subscription-Usage-Windows-Portable.zip"
          Copy-Item "dist-installer\*.exe" release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: ai-subscription-usage-${{ runner.os }}
          path: release-assets/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: sha256sum release/* > release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
